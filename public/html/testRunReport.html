<script type="text/javascript">
  function createWaterMark(message, options, dom) {
    var font = options && options.font || '16px sans-serif';
    var color = options && options.color || '#7f7f7f';
    var position = options && options.position;
    var width = options && options.width || 160;
    var height = options && options.height || 160;
    var angleCount = options && options.angleCount || 6;
    var globalAlpha = options && options.globalAlpha || 0.1;
    var zIndex = options && options.zIndex || '10000000';

    var canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    var ctx = canvas.getContext('2d');
    if (!ctx) {
      return;
    }

    ctx.font = font;
    ctx.fillStyle = color;
    ctx.globalAlpha = globalAlpha;
    ctx.translate(width / 2, height / 2);
    ctx.rotate(-Math.PI / angleCount);
    ctx.textAlign = 'center';
    ctx.fillText(message || '', 0, 0);
    var dataURL = canvas.toDataURL('image/png');

    var mask = document.createElement('div');
    mask.style.width = '100%';
    mask.style.height = '100%';
    mask.style.position = 'fixed';
    mask.style.left = '0';
    mask.style.right = '0';
    mask.style.top = '0';
    mask.style.bottom = '0';
    mask.style.zIndex = zIndex;
    mask.style.pointerEvents = 'none';
    mask.style.backgroundImage = 'url(' + dataURL + ')';

    dom = dom || document.body;
    dom.appendChild(mask);
  }
  createWaterMark(

  function formatToThreeDecimal(num) {
    // 判断是否是数字
    if (isNaN(num)) return num;

    const str = num.toString();
    const decimalPart = str.split('.')[1];

    if (decimalPart && decimalPart.length > 3) {
      return parseFloat(num).toFixed(3);  // 保留三位
    }

    return num; // 原样返回
  }

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    html {
      font-family: PingFangSC-Regular, PingFang SC, CenturyGothic;
    }

    .page {
      position: relative;
      width: 992px;
      height: 1395px;
    }

    .page .bg {
      z-index: 0;
      display: block;
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
    }

    .info1 {
      position: absolute;
      top: 18%;
      right: 58%;
    }
  </style>
</head>

<body style="margin: 0">
  <div class="pageContainer"></div>
  <script>
    var reportData = {reportDataReference};


    var pageHtml =
      '<div class="page">' +
      '<img src="' +
      'https://static-btri.midea.com/mfs/1026/1712641724153.png" alt="bg" class="bg" />' +
      '<div class="info1">' +
      reportData.reportOverview.systemCount +
      "</div>" +
      "</div>";
    document.querySelector(".pageContainer").innerHTML = pageHtml;
  </script>
</body>

</html>

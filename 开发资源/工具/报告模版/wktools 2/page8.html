<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      html {
        font-family: PingFangSC-Regular, PingFang SC, CenturyGothic;
      }

      .page {
        position: relative;
        width: 992px;
        height: 1403px;
      }

      .page .bg {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      .value1,
      .value2,
      .value3 {
        position: absolute;
        left: 0;
        height: 33px;
        color: #2b3448;
        font-weight: bold;
        font-size: 27px;
        font-family: CenturyGothic-Bold, CenturyGothic;
        line-height: 33px;
      }

      /* .value2 {
        left: 130px;
      }

      .value3 {
        left: 258px;
      } */

      .chartBox {
        position: absolute;
        width: 278px;
        height: 120px;
        top: 170px;
        left: 692px;
      }
      #chart1 {
        width: 130px;
        height: 130px;
      }
      .msg {
        position: absolute;
        top: 40px;
        left: 146px;
        font-size: 12px;
      }
      .msg .msgItem {
        position: relative;
        align-items: center;
      }
      .msg .msgItem0 {
        padding-bottom: 12px;
      }
      .msg .msgLabel {
        color: #8e9ab4;
        font-size: 12px;
      }
      .msg .msgItem::before {
        position: absolute;
        top: 5px;
        left: -12px;
        display: block;
        width: 6px;
        height: 6px;
        background-color: #1962ff;
        border-radius: 50%;
        content: ' ';
      }
      .msg .msgItem1:before {
        background-color: #ff7800;
      }
      .chartData1 {
        position: absolute;
        top: 2px;
        left: 30px;
        text-align: center;
      }
      .chartImg {
        display: block;
        width: 70px;
        margin: 0 auto;
      }
      .chartRate {
        position: relative;
        top: -16px;
        color: #0d0d0d;
        font-weight: bold;
        font-size: 22px;
        line-height: 24px;
      }
      .chartSubTitle {
        position: relative;
        top: -14px;
        color: #8e9ab4;
        font-size: 12px;
      }
      .watermark {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9;
      }
    </style>
  </head>
  <script src="https://static-btri.midea.com/mfs/2676/1706522482131.js?8"></script>

  <body style="margin: 0">
    <div class="pageContainer"></div>
    <script>
      var reportData = {reportDataReference};


      function getValue(val) {
        if (val === 0) {
          return val;
        } else if (!val) {
          return '-';
        } else {
          return val;
        }
      }

      function getChart1Render(list) {
        var color_1 = ['#FF7800', '#1962FF'];
        var color_2 = ['#1962FF', '#FF7800'];
        var data_1 = list.slice(0);
        var data_2 = list.slice(0);
        data_1.forEach(function (item, index) {
          item.itemStyle = {
            color: color_1[index],
          };
        });
        data_2.forEach(function (item, index) {
          item.itemStyle = {
            color: color_2[index],
            borderColor: color_2[index],
          };
        });
        var option1 = {
          series: [
            {
              name: 'Access From',
              type: 'pie',
              radius: ['70%', '80%'],
              avoidLabelOverlap: false, // 防止标签重叠
              hoverAnimation: false,
              animation: false,
              itemStyle: {
                borderWidth: 0,
                borderColor: '#fff',
                //   borderRadius: [0, '50%', 0, '50%']
              },
              label: {
                show: false,
                position: 'center', // 标签位置
              },
              emphasis: {
                label: {
                  show: false,
                  fontSize: 40,
                  fontWeight: 'bold',
                },
              },
              labelLine: {
                show: false,
              },
              data: data_1,
              z: 0,
            },
            {
              name: 'Access From',
              type: 'pie',
              radius: ['70%', '80%'],
              avoidLabelOverlap: false,
              hoverAnimation: false,
              animation: false,
              itemStyle: {
                borderRadius: [0, '50%', 0, '50%'],
              },
              label: {
                show: false,
                position: 'center',
              },
              emphasis: {
                label: {
                  show: false,
                  fontSize: 40,
                  fontWeight: 'bold',
                },
              },
              labelLine: {
                show: false,
              },
              data: data_2,
            },
          ],
        };
        var myChart1 = echarts.init(document.getElementById('chart1'));
        myChart1.setOption(option1);
      }

      function getPieRate() {
        var totalObj = reportData.total || {};
        var iduEnergyTotal = totalObj.iduEnergyTotal || 0;
        var iduEnergyWasteTotal = totalObj.iduEnergyWasteTotal || 0;
        return ((iduEnergyWasteTotal / iduEnergyTotal) * 100).toFixed(0) + '%';
      }

      function getPieData() {
        var totalObj = reportData.total || {};
        var iduEnergyTotal = totalObj.iduEnergyTotal || 0;
        var iduEnergyWasteTotal = totalObj.iduEnergyWasteTotal || 0;

        return [
          { name: '常规电量', value: iduEnergyTotal - iduEnergyWasteTotal },
          { name: '可节约电量', value: iduEnergyWasteTotal },
        ];
      }

      var pieData = getPieData();

      function getLegends() {
        var h = pieData.map(function(item,index) {
            return '<div class="msgItem msgItem' + index  + '">' + '<div class="msgLabel">' + item.name + '</div>' + '</div>';
          }).join('');
        return '<div class="msg">' + h + '</div>';
      }

function createWatermark() {
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');

canvas.width = 700;
canvas.height = 1150;

// 设置文字样式
ctx.font = '10px Arial';
ctx.fillStyle = 'rgba(0, 0, 0, 0.07)';

// 保存当前状态
ctx.save();
// 移动并旋转画布
ctx.translate(150, 100);
ctx.rotate(-30 * Math.PI / 180);
ctx.fillText(reportData.watermarkText, -50, 0);
ctx.restore();

// 将 canvas 转换为背景图片
return '<div class="watermark" style="background-image: url(' +
canvas.toDataURL() + '); background-repeat: repeat;"></div>';
}

      var pageHtml =
        '<div class="page">' +
        createWatermark() +
        '<img src="' +
        'https://static-btri.midea.com/mfs/18493/1715666287671.jpg" alt="bg" class="bg" />' +
        '<div class="box">' +
        '<div class="value1" style="top: 195px; left: 265px;">' +
        getValue(reportData.total ? reportData.total.iduEnergyWasteTotal : 0) +
        '</div>' +
        '<div class="value2" style="top: 195px; left: 564px;">' +
        getValue(reportData.total ? reportData.total.carbonTotal : 0) +
        '</div>' +
        '<div class="value3" style="top: 246px; left: 247px;">' +
        getValue(reportData.total ? reportData.total.iduEnergyWasteBillTotal : 0) +
        '</div>' +
        '<div class="chartBox">' +
        '<div id="chart1"></div>' +

        '<div class="chartData1">' +
        '<img src="https://static-btri.midea.com/mfs/18493/1715667284925.png" alt="chartimg" class="chartImg" />' +
        '<div class="chartRate">' +
        getPieRate() +
        '</div>' +
        '<div class="chartSubTitle">预估节能率</div>' +
        '</div>' +

        getLegends() +

        '</div>' +
        '</div>';
      document.querySelector('.pageContainer').innerHTML = pageHtml;

      getChart1Render(pieData);
    </script>
  </body>
</html>
